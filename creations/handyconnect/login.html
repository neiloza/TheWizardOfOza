<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HandyConnect</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .login-container { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 2rem; }
        .login-box { background: white; padding: 3rem; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); max-width: 450px; width: 100%; }
        .login-header { text-align: center; margin-bottom: 2rem; }
        .login-header h1 { color: var(--dark); font-size: 2rem; margin-bottom: 0.5rem; }
        .login-header p { color: var(--gray); }
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: var(--dark); }
        .form-group input { width: 100%; padding: 0.9rem; border: 2px solid #e5e7eb; border-radius: 6px; font-family: inherit; transition: border-color 0.3s; font-size: 1rem; }
        .form-group input:focus { outline: none; border-color: var(--primary); }
        .remember-forgot { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; font-size: 0.9rem; }
        .remember-forgot a { color: var(--primary); text-decoration: none; }
        .remember-forgot a:hover { text-decoration: underline; }
        .btn-submit { width: 100%; padding: 1rem; background: var(--primary); color: white; border: none; border-radius: 6px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: background 0.3s; }
        .btn-submit:hover { background: var(--primary-dark); }
        .divider { text-align: center; margin: 2rem 0; color: var(--gray); position: relative; }
        .divider::before, .divider::after { content: ''; position: absolute; top: 50%; width: 45%; height: 1px; background: #e5e7eb; }
        .divider::before { left: 0; }
        .divider::after { right: 0; }
        .signup-link { text-align: center; margin-top: 2rem; color: var(--gray); }
        .signup-link a { color: var(--primary); font-weight: 600; text-decoration: none; }
        .signup-link a:hover { text-decoration: underline; }
    </style>
    <link rel="stylesheet" href="hamburger-menu.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h1><i class="fas fa-tools"></i> HandyConnect</h1>
                <p>Welcome back! Please login to your account</p>
            </div>
            
            <form action="portal.html" method="get">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <div class="remember-forgot">
                    <label style="display: flex; align-items: center; gap: 0.5rem; font-weight: normal;">
                        <input type="checkbox" name="remember"> Remember me
                    </label>
                    <a href="#">Forgot password?</a>
                </div>
                
                <button type="submit" class="btn-submit">Login</button>
            </form>
            
            <div class="divider">or</div>
            
            <div style="display: flex; flex-direction: column; gap: 1rem;">
                <button style="width: 100%; padding: 0.9rem; background: white; border: 2px solid #e5e7eb; border-radius: 6px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
                    <i class="fab fa-google" style="color: #db4437;"></i> Continue with Google
                </button>
                <button style="width: 100%; padding: 0.9rem; background: white; border: 2px solid #e5e7eb; border-radius: 6px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
                    <i class="fab fa-facebook" style="color: #4267B2;"></i> Continue with Facebook
                </button>
            </div>
            
            <div class="signup-link">
                Don't have an account? <a href="signup.html">Sign up</a>
            </div>
        </div>
    </div>
    <script src="hamburger-menu.js"></script>
</body>
</html>
