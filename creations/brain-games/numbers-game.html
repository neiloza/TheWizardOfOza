<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Numbers Game - Brain Training</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { width: 100%; min-height: 100%; }
    html { font-size: 16px; -webkit-text-size-adjust: 100%; }
    body { 
      font-family: 'Nunito', sans-serif; 
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      touch-action: manipulation;
    }
    /* Mobile-friendly tap targets */
    button, [role="button"] { 
      min-height: 44px; 
      min-width: 44px; 
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    input { 
      font-size: 16px !important; /* Prevents iOS zoom on focus */
      -webkit-appearance: none;
      border-radius: 0;
    }
    /* Smooth scrolling */
    * { -webkit-overflow-scrolling: touch; }
    /* Prevent text selection on game elements */
    .no-select { 
      -webkit-user-select: none; 
      user-select: none; 
    }
    /* Safe area insets for notched phones */
    #root {
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      padding-bottom: env(safe-area-inset-bottom);
    }
    /* Responsive text scaling */
    @media (max-width: 380px) {
      html { font-size: 14px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <script type="text/babel" data-type="module">

const THEMES = {
  cozy: { name: "Cozy Cream", emoji: "☕", bg: "#FFF8F0", card: "#FFFFFF", primary: "#5B8C7A", primaryLight: "#E8F3EE", accent: "#E8985E", accentLight: "#FFF0E5", text: "#3D3229", textLight: "#7A6E63", border: "#E8DDD0", success: "#4A8A5A", error: "#C45050", successLight: "#E2F5E6", errorLight: "#FDEAE8" },
  ocean: { name: "Ocean Breeze", emoji: "🌊", bg: "#F0F7FA", card: "#FFFFFF", primary: "#3A7CA5", primaryLight: "#DCF0FA", accent: "#E8985E", accentLight: "#FFF0E5", text: "#1A3A4A", textLight: "#5A7A8A", border: "#C8DDE8", success: "#3A8A5A", error: "#C45050", successLight: "#E0F5EC", errorLight: "#FAE0E0" },
  garden: { name: "Garden Path", emoji: "🌸", bg: "#FBF7F0", card: "#FFFFFF", primary: "#7A8B6E", primaryLight: "#EEF3EA", accent: "#C4766E", accentLight: "#FCE8E5", text: "#3A3A2E", textLight: "#6A6E5A", border: "#DDE0D0", success: "#4A8A5A", error: "#C45050", successLight: "#E8F0E5", errorLight: "#FCE8E5" },
  sunset: { name: "Warm Sunset", emoji: "🌅", bg: "#FFF5EE", card: "#FFFFFF", primary: "#C0785A", primaryLight: "#FFEEDD", accent: "#8B6FA3", accentLight: "#F0EAF5", text: "#3D2E29", textLight: "#8A6E63", border: "#E8D8C8", success: "#4A8A5A", error: "#C45050", successLight: "#E8F3EE", errorLight: "#FDEAE8" },
  lavender: { name: "Soft Lavender", emoji: "💜", bg: "#F8F5FC", card: "#FFFFFF", primary: "#8B6FA3", primaryLight: "#F0EAF5", accent: "#E8985E", accentLight: "#FFF0E5", text: "#3A2E4A", textLight: "#7A6E8A", border: "#DDD5E8", success: "#4A8A5A", error: "#C45050", successLight: "#E5F0E5", errorLight: "#FAE0E5" },
};

function ThemePicker({ themeName, setThemeName, t }) {
  const [open, setOpen] = React.useState(false);
  return (
    <div style={{ position: "relative", zIndex: 10 }}>
      <button onClick={() => setOpen(!open)} style={{ background: t.card, border: `2px solid ${t.border}`, borderRadius: 12, padding: "8px 16px", fontSize: 14, fontWeight: 700, cursor: "pointer", fontFamily: "'Nunito', sans-serif", color: t.text, display: "flex", alignItems: "center", gap: 6 }}>
        {THEMES[themeName].emoji} Theme
      </button>
      {open && (
        <div style={{ position: "absolute", top: "100%", right: 0, marginTop: 8, background: t.card, borderRadius: 16, boxShadow: "0 8px 32px rgba(0,0,0,0.15)", border: `1px solid ${t.border}`, padding: 8, minWidth: 200 }}>
          {Object.entries(THEMES).map(([key, th]) => (
            <button key={key} onClick={() => { setThemeName(key); setOpen(false); }} style={{ display: "flex", alignItems: "center", gap: 10, width: "100%", padding: "10px 14px", border: "none", borderRadius: 10, cursor: "pointer", background: key === themeName ? t.primaryLight : "transparent", fontFamily: "'Nunito', sans-serif", fontSize: 15, fontWeight: 600, color: t.text }}>
              <span style={{ fontSize: 20 }}>{th.emoji}</span><span>{th.name}</span>{key === themeName && <span style={{ marginLeft: "auto" }}>✓</span>}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function App() {
  const [themeName, setThemeName] = React.useState("cozy");
  const t = THEMES[themeName];
  const [screen, setScreen] = React.useState("menu");
  const [digitCount, setDigitCount] = React.useState(5);
  const [generatedNumber, setGeneratedNumber] = React.useState("");
  const [userInput, setUserInput] = React.useState("");
  const [result, setResult] = React.useState(null);
  const [round, setRound] = React.useState(1);
  const [score, setScore] = React.useState(0);
  const [totalRounds] = React.useState(5);
  const [showNumber, setShowNumber] = React.useState(true);
  const [countdown, setCountdown] = React.useState(null);
  const [bestScores, setBestScores] = React.useState({});

  const generateNumber = React.useCallback(() => {
    let num = "";
    for (let i = 0; i < digitCount; i++) num += Math.floor(Math.random() * 10).toString();
    if (num[0] === "0") num = (Math.floor(Math.random() * 9) + 1).toString() + num.slice(1);
    return num;
  }, [digitCount]);

  const startGame = () => {
    const num = generateNumber();
    setGeneratedNumber(num); setUserInput(""); setResult(null); setRound(1); setScore(0);
    setShowNumber(true); setScreen("play");
    setCountdown(Math.max(3, Math.floor(digitCount * 0.8)));
  };

  React.useEffect(() => {
    if (screen === "play" && showNumber && countdown !== null) {
      if (countdown <= 0) { setShowNumber(false); setCountdown(null); return; }
      const timer = setTimeout(() => setCountdown(countdown - 1), 1000);
      return () => clearTimeout(timer);
    }
  }, [countdown, screen, showNumber]);

  const handleSubmit = () => {
    const correct = userInput === generatedNumber;
    const newScore = correct ? score + 1 : score;
    setScore(newScore);
    setResult({ correct, answer: generatedNumber, userAnswer: userInput });
    if (round >= totalRounds) {
      const prev = bestScores[digitCount] || 0;
      if (newScore > prev) setBestScores({ ...bestScores, [digitCount]: newScore });
    }
  };

  const nextRound = () => {
    if (round >= totalRounds) { setScreen("summary"); return; }
    const num = generateNumber();
    setGeneratedNumber(num); setUserInput(""); setResult(null); setRound(round + 1);
    setShowNumber(true); setCountdown(Math.max(3, Math.floor(digitCount * 0.8)));
  };

  const DigitComparison = ({ answer, userAns }) => {
    const maxLen = Math.max(answer.length, userAns.length);
    return (
      <div style={{ width: "100%" }}>
        <p style={{ fontSize: 14, color: t.textLight, marginBottom: 8, textAlign: "center" }}>Your answer vs correct:</p>
        <div style={{ display: "flex", gap: 4, justifyContent: "center", flexWrap: "wrap" }}>
          {Array.from({ length: maxLen }).map((_, i) => {
            const correctChar = answer[i] || "";
            const userChar = userAns[i] || "";
            const match = correctChar === userChar && correctChar !== "";
            const missing = i >= userAns.length;
            const extra = i >= answer.length;
            return (
              <div key={i} style={{
                width: digitCount > 12 ? 30 : 38, borderRadius: 10,
                background: missing ? t.accentLight : match ? t.successLight : t.errorLight,
                border: `2.5px solid ${missing ? t.accent : match ? t.success : t.error}`,
                padding: "6px 0", textAlign: "center",
              }}>
                <div style={{ fontSize: 11, color: t.textLight, fontWeight: 600, lineHeight: 1.2, minHeight: 14 }}>
                  {!missing && !extra ? userChar : missing ? "—" : userChar}
                </div>
                <div style={{
                  fontSize: digitCount > 12 ? 16 : 20, fontFamily: "'Fredoka One', cursive",
                  color: match ? t.success : t.error, lineHeight: 1.2,
                }}>
                  {extra ? "" : correctChar}
                </div>
              </div>
            );
          })}
        </div>
        <div style={{ display: "flex", gap: 16, justifyContent: "center", marginTop: 10 }}>
          <span style={{ fontSize: 12, color: t.textLight, display: "flex", alignItems: "center", gap: 4 }}>
            <span style={{ display: "inline-block", width: 12, height: 12, borderRadius: 3, background: t.successLight, border: `2px solid ${t.success}` }} /> Correct
          </span>
          <span style={{ fontSize: 12, color: t.textLight, display: "flex", alignItems: "center", gap: 4 }}>
            <span style={{ display: "inline-block", width: 12, height: 12, borderRadius: 3, background: t.errorLight, border: `2px solid ${t.error}` }} /> Wrong
          </span>
        </div>
      </div>
    );
  };

  const btnStyle = (bg, color, border) => ({
    padding: "16px", fontSize: 17, fontWeight: 700, fontFamily: "'Nunito', sans-serif",
    background: bg, color, border: border || "none", borderRadius: 14, cursor: "pointer", flex: 1,
  });

  return (
    <>
      
      <style>{`* { margin: 0; padding: 0; box-sizing: border-box; }`}</style>
      <div style={{ minHeight: "100%", background: t.bg, fontFamily: "'Nunito', sans-serif", color: t.text, display: "flex", flexDirection: "column", alignItems: "center", padding: "24px 16px", transition: "background 0.3s" }}>
        {screen === "menu" && (
          <div style={{ maxWidth: 480, width: "100%", display: "flex", flexDirection: "column", alignItems: "center", gap: 24, paddingTop: 16 }}>
            <div style={{ alignSelf: "flex-end" }}><ThemePicker themeName={themeName} setThemeName={setThemeName} t={t} /></div>
            <div style={{ fontSize: 48 }}>🔢</div>
            <h1 style={{ fontFamily: "'Fredoka One', cursive", fontSize: 32, color: t.primary, textAlign: "center" }}>Numbers Game</h1>
            <p style={{ fontSize: 18, color: t.textLight, textAlign: "center", lineHeight: 1.6, maxWidth: 360 }}>
              Remember the number shown on screen, then type it from memory.
            </p>
            <div style={{ background: t.card, borderRadius: 20, padding: "28px 32px", width: "100%", boxShadow: "0 2px 16px rgba(0,0,0,0.06)", border: `1px solid ${t.border}` }}>
              <label style={{ fontSize: 18, fontWeight: 700, display: "block", marginBottom: 16, textAlign: "center" }}>How many digits?</label>
              <div style={{ display: "flex", alignItems: "center", gap: 16, justifyContent: "center", marginBottom: 12 }}>
                <button onClick={() => setDigitCount(Math.max(5, digitCount - 1))} style={{ width: 52, height: 52, borderRadius: 14, border: `2px solid ${t.border}`, background: t.card, fontSize: 24, fontWeight: 700, cursor: "pointer", color: t.text, display: "flex", alignItems: "center", justifyContent: "center" }}>−</button>
                <span style={{ fontSize: 40, fontFamily: "'Fredoka One', cursive", color: t.primary, minWidth: 60, textAlign: "center" }}>{digitCount}</span>
                <button onClick={() => setDigitCount(Math.min(20, digitCount + 1))} style={{ width: 52, height: 52, borderRadius: 14, border: `2px solid ${t.border}`, background: t.card, fontSize: 24, fontWeight: 700, cursor: "pointer", color: t.text, display: "flex", alignItems: "center", justifyContent: "center" }}>+</button>
              </div>
              <p style={{ textAlign: "center", fontSize: 15, color: t.textLight }}>Choose between 5 and 20 digits</p>
            </div>
            <button onClick={startGame} style={{ width: "100%", padding: "18px 32px", fontSize: 20, fontWeight: 700, fontFamily: "'Nunito', sans-serif", background: t.primary, color: "#fff", border: "none", borderRadius: 16, cursor: "pointer" }}>Start Game</button>
          </div>
        )}

        {screen === "play" && (
          <div style={{ maxWidth: 520, width: "100%", display: "flex", flexDirection: "column", alignItems: "center", gap: 20, paddingTop: 20 }}>
            <div style={{ display: "flex", justifyContent: "space-between", width: "100%", alignItems: "center" }}>
              <span style={{ fontSize: 16, color: t.textLight, fontWeight: 600 }}>Round {round}/{totalRounds}</span>
              <span style={{ fontSize: 16, color: t.primary, fontWeight: 700 }}>Score: {score}</span>
            </div>
            <div style={{ width: "100%", height: 8, background: t.border, borderRadius: 4, overflow: "hidden" }}>
              <div style={{ height: "100%", width: `${(round / totalRounds) * 100}%`, background: t.primary, borderRadius: 4, transition: "width 0.3s" }} />
            </div>
            <div style={{ background: t.card, borderRadius: 24, padding: "36px 24px", width: "100%", boxShadow: "0 2px 16px rgba(0,0,0,0.06)", border: `1px solid ${t.border}`, textAlign: "center", minHeight: 220, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 20 }}>
              {showNumber ? (
                <>
                  <p style={{ fontSize: 16, color: t.textLight, fontWeight: 600 }}>Remember this number:</p>
                  <p style={{ fontSize: digitCount > 12 ? 28 : digitCount > 8 ? 34 : 42, fontFamily: "'Fredoka One', cursive", color: t.primary, letterSpacing: digitCount > 12 ? 4 : 6, wordBreak: "break-all", lineHeight: 1.4 }}>{generatedNumber}</p>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, color: t.accent, fontWeight: 700, fontSize: 18 }}>⏱ {countdown}s</div>
                </>
              ) : result ? (
                <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 16, width: "100%" }}>
                  <div style={{ fontSize: 48 }}>{result.correct ? "🎉" : "😊"}</div>
                  <p style={{ fontSize: 22, fontWeight: 800, color: result.correct ? t.success : t.error }}>
                    {result.correct ? "Well Done!" : "Not quite!"}
                  </p>
                  {result.correct ? (
                    <p style={{ fontSize: 22, fontFamily: "'Fredoka One', cursive", color: t.success, letterSpacing: 3 }}>{result.answer}</p>
                  ) : (
                    <DigitComparison answer={result.answer} userAns={result.userAnswer} />
                  )}
                  <button onClick={nextRound} style={{ width: "100%", ...btnStyle(t.primary, "#fff"), marginTop: 8 }}>
                    {round >= totalRounds ? "See Results" : "Next Round →"}
                  </button>
                </div>
              ) : (
                <>
                  <p style={{ fontSize: 18, color: t.textLight, fontWeight: 600 }}>What was the number?</p>
                  <input type="text" inputMode="numeric" value={userInput}
                    onChange={(e) => setUserInput(e.target.value.replace(/[^0-9]/g, ""))}
                    onKeyDown={(e) => { if (e.key === "Enter" && userInput.length > 0) handleSubmit(); }}
                    autoFocus placeholder="Type the number here..."
                    style={{ width: "100%", padding: "16px 20px", fontSize: 24, fontFamily: "'Fredoka One', cursive", textAlign: "center", border: `2px solid ${t.border}`, borderRadius: 14, outline: "none", color: t.text, letterSpacing: 4, background: t.bg }}
                    onFocus={(e) => e.target.style.borderColor = t.primary}
                    onBlur={(e) => e.target.style.borderColor = t.border}
                  />
                  <button onClick={handleSubmit} disabled={!userInput.length} style={{ width: "100%", ...btnStyle(userInput.length ? t.primary : t.border, "#fff"), cursor: userInput.length ? "pointer" : "default" }}>Check Answer</button>
                </>
              )}
            </div>
            <button onClick={() => setScreen("menu")} style={{ background: "none", border: "none", color: t.textLight, fontSize: 16, fontWeight: 600, cursor: "pointer", fontFamily: "'Nunito', sans-serif" }}>← Back to Menu</button>
          </div>
        )}

        {screen === "summary" && (
          <div style={{ maxWidth: 480, width: "100%", display: "flex", flexDirection: "column", alignItems: "center", gap: 24, paddingTop: 40 }}>
            <div style={{ fontSize: 56 }}>{score >= totalRounds ? "🌟" : score >= totalRounds * 0.6 ? "👏" : "💪"}</div>
            <h2 style={{ fontFamily: "'Fredoka One', cursive", fontSize: 28, color: t.primary }}>
              {score >= totalRounds ? "Perfect Score!" : score >= totalRounds * 0.6 ? "Great Job!" : "Good Try!"}
            </h2>
            <div style={{ background: t.card, borderRadius: 20, padding: "28px 32px", width: "100%", textAlign: "center", boxShadow: "0 2px 16px rgba(0,0,0,0.06)", border: `1px solid ${t.border}` }}>
              <p style={{ fontSize: 16, color: t.textLight, marginBottom: 8 }}>Your Score</p>
              <p style={{ fontSize: 48, fontFamily: "'Fredoka One', cursive", color: t.primary }}>{score}/{totalRounds}</p>
              <p style={{ fontSize: 16, color: t.textLight, marginTop: 8 }}>with {digitCount}-digit numbers</p>
            </div>
            <div style={{ display: "flex", gap: 12, width: "100%" }}>
              <button onClick={startGame} style={btnStyle(t.primary, "#fff")}>Play Again</button>
              <button onClick={() => setScreen("menu")} style={btnStyle(t.card, t.text, `2px solid ${t.border}`)}>Menu</button>
            </div>
          </div>
        )}
      </div>
    </>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
