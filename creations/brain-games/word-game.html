<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Word Game - Brain Training</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { width: 100%; min-height: 100%; }
    html { font-size: 16px; -webkit-text-size-adjust: 100%; }
    body { 
      font-family: 'Nunito', sans-serif; 
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      touch-action: manipulation;
    }
    /* Mobile-friendly tap targets */
    button, [role="button"] { 
      min-height: 44px; 
      min-width: 44px; 
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    input { 
      font-size: 16px !important; /* Prevents iOS zoom on focus */
      -webkit-appearance: none;
      border-radius: 0;
    }
    /* Smooth scrolling */
    * { -webkit-overflow-scrolling: touch; }
    /* Prevent text selection on game elements */
    .no-select { 
      -webkit-user-select: none; 
      user-select: none; 
    }
    /* Safe area insets for notched phones */
    #root {
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      padding-bottom: env(safe-area-inset-bottom);
    }
    /* Responsive text scaling */
    @media (max-width: 380px) {
      html { font-size: 14px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <script type="text/babel" data-type="module">

const THEMES = {
  cozy: { name: "Cozy Cream", emoji: "☕", bg: "#FFF8F0", card: "#FFFFFF", primary: "#8B6FA3", primaryLight: "#F0EAF5", accent: "#E8985E", accentLight: "#FFF0E5", text: "#3D3229", textLight: "#7A6E63", border: "#E8DDD0", success: "#5B8C7A", successLight: "#E8F3EE", error: "#D4726A", errorLight: "#FDEAE8" },
  ocean: { name: "Ocean Breeze", emoji: "🌊", bg: "#F0F7FA", card: "#FFFFFF", primary: "#3A7CA5", primaryLight: "#DCF0FA", accent: "#E8985E", accentLight: "#FFF0E5", text: "#1A3A4A", textLight: "#5A7A8A", border: "#C8DDE8", success: "#3A8A6A", successLight: "#E0F5EC", error: "#C45A5A", errorLight: "#FAE0E0" },
  garden: { name: "Garden Path", emoji: "🌸", bg: "#FBF7F0", card: "#FFFFFF", primary: "#7A8B6E", primaryLight: "#EEF3EA", accent: "#C4766E", accentLight: "#FCE8E5", text: "#3A3A2E", textLight: "#6A6E5A", border: "#DDE0D0", success: "#6A8E5A", successLight: "#E8F0E5", error: "#C4766E", errorLight: "#FCE8E5" },
  sunset: { name: "Warm Sunset", emoji: "🌅", bg: "#FFF5EE", card: "#FFFFFF", primary: "#C0785A", primaryLight: "#FFEEDD", accent: "#8B6FA3", accentLight: "#F0EAF5", text: "#3D2E29", textLight: "#8A6E63", border: "#E8D8C8", success: "#5B8C7A", successLight: "#E8F3EE", error: "#D4726A", errorLight: "#FDEAE8" },
  lavender: { name: "Soft Lavender", emoji: "💜", bg: "#F8F5FC", card: "#FFFFFF", primary: "#8B6FA3", primaryLight: "#F0EAF5", accent: "#E8985E", accentLight: "#FFF0E5", text: "#3A2E4A", textLight: "#7A6E8A", border: "#DDD5E8", success: "#6A8E6A", successLight: "#E5F0E5", error: "#C45A6A", errorLight: "#FAE0E5" },
};

function ThemePicker({ themeName, setThemeName, t }) {
  const [open, setOpen] = React.useState(false);
  return (
    <div style={{ position: "relative", zIndex: 10 }}>
      <button onClick={() => setOpen(!open)} style={{ background: t.card, border: `2px solid ${t.border}`, borderRadius: 12, padding: "8px 16px", fontSize: 14, fontWeight: 700, cursor: "pointer", fontFamily: "'Nunito', sans-serif", color: t.text, display: "flex", alignItems: "center", gap: 6 }}>
        {THEMES[themeName].emoji} Theme
      </button>
      {open && (
        <div style={{ position: "absolute", top: "100%", right: 0, marginTop: 8, background: t.card, borderRadius: 16, boxShadow: "0 8px 32px rgba(0,0,0,0.15)", border: `1px solid ${t.border}`, padding: 8, minWidth: 200 }}>
          {Object.entries(THEMES).map(([key, th]) => (
            <button key={key} onClick={() => { setThemeName(key); setOpen(false); }} style={{ display: "flex", alignItems: "center", gap: 10, width: "100%", padding: "10px 14px", border: "none", borderRadius: 10, cursor: "pointer", background: key === themeName ? t.primaryLight : "transparent", fontFamily: "'Nunito', sans-serif", fontSize: 15, fontWeight: 600, color: t.text }}>
              <span style={{ fontSize: 20 }}>{th.emoji}</span><span>{th.name}</span>{key === themeName && <span style={{ marginLeft: "auto" }}>✓</span>}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

const CATEGORIES = {
  animals: { name: "Animals", emoji: "🐾", words: ["Cat","Dog","Horse","Elephant","Tiger","Bear","Eagle","Dolphin","Rabbit","Deer","Fox","Wolf","Penguin","Giraffe","Lion","Monkey","Parrot","Turtle","Whale","Shark","Owl","Swan","Goat","Sheep","Duck"] },
  fruits: { name: "Fruits", emoji: "🍎", words: ["Apple","Banana","Cherry","Grape","Lemon","Mango","Peach","Pear","Plum","Orange","Melon","Kiwi","Fig","Lime","Date","Berry","Coconut","Papaya","Guava","Apricot"] },
  colors_cat: { name: "Colors", emoji: "🎨", words: ["Red","Blue","Green","Yellow","Purple","Orange","Pink","White","Black","Brown","Gray","Gold","Silver","Teal","Coral","Violet","Cream","Maroon","Navy","Olive"] },
  kitchen: { name: "Kitchen", emoji: "🍳", words: ["Spoon","Fork","Knife","Plate","Bowl","Cup","Pan","Pot","Oven","Stove","Sink","Towel","Timer","Apron","Ladle","Tray","Mug","Jar","Whisk","Grater"] },
  clothing: { name: "Clothing", emoji: "👔", words: ["Shirt","Pants","Dress","Shoes","Jacket","Socks","Hat","Scarf","Gloves","Belt","Coat","Tie","Vest","Boots","Skirt","Shorts","Sweater","Blouse","Sandals","Cap"] },
  nature: { name: "Nature", emoji: "🌿", words: ["Tree","Flower","River","Mountain","Cloud","Rain","Snow","Wind","Lake","Forest","Grass","Stone","Sand","Wave","Leaf","Pond","Hill","Cliff","Meadow","Brook"] },
  body: { name: "Body Parts", emoji: "🦶", words: ["Hand","Foot","Head","Arm","Leg","Knee","Elbow","Finger","Thumb","Wrist","Ankle","Shoulder","Neck","Chin","Ear","Nose","Mouth","Tooth","Tongue","Heel"] },
};

function App() {
  const [themeName, setThemeName] = React.useState("cozy");
  const t = THEMES[themeName];
  const [screen, setScreen] = React.useState("menu");
  const [category, setCategory] = React.useState(null);
  const [wordCount, setWordCount] = React.useState(5);
  const [words, setWords] = React.useState([]);
  const [userInput, setUserInput] = React.useState("");
  const [submitted, setSubmitted] = React.useState([]);
  const [results, setResults] = React.useState(null);
  const [countdown, setCountdown] = React.useState(0);

  const startGame = (cat) => {
    setCategory(cat);
    const shuffled = [...CATEGORIES[cat].words].sort(() => Math.random() - 0.5).slice(0, wordCount);
    setWords(shuffled); setSubmitted([]); setUserInput(""); setResults(null);
    setCountdown(Math.max(5, wordCount * 2)); setScreen("study");
  };

  React.useEffect(() => {
    if (screen === "study" && countdown > 0) { const t = setTimeout(() => setCountdown(countdown - 1), 1000); return () => clearTimeout(t); }
    if (screen === "study" && countdown === 0) setScreen("recall");
  }, [screen, countdown]);

  const addWord = () => {
    const trimmed = userInput.trim();
    if (trimmed && !submitted.some(w => w.toLowerCase() === trimmed.toLowerCase())) { setSubmitted([...submitted, trimmed]); setUserInput(""); }
  };

  const check = () => {
    const tl = words.map(w => w.toLowerCase());
    const remembered = [], wrong = [];
    submitted.forEach(sw => { if (tl.includes(sw.toLowerCase())) remembered.push(sw); else wrong.push(sw); });
    const missed = words.filter(w => !submitted.some(sw => sw.toLowerCase() === w.toLowerCase()));
    setResults({ remembered, wrong, missed, total: words.length }); setScreen("results");
  };

  return (
    <>
      
      <style>{`* { margin: 0; padding: 0; box-sizing: border-box; }`}</style>
      <div style={{ minHeight: "100%", background: t.bg, fontFamily: "'Nunito', sans-serif", color: t.text, display: "flex", flexDirection: "column", alignItems: "center", padding: "24px 16px" }}>
        {screen === "menu" && (
          <div style={{ maxWidth: 480, width: "100%", display: "flex", flexDirection: "column", alignItems: "center", gap: 20, paddingTop: 16 }}>
            <div style={{ alignSelf: "flex-end" }}><ThemePicker themeName={themeName} setThemeName={setThemeName} t={t} /></div>
            <div style={{ fontSize: 48 }}>💬</div>
            <h1 style={{ fontFamily: "'Fredoka One', cursive", fontSize: 32, color: t.primary, textAlign: "center" }}>Word Game</h1>
            <p style={{ fontSize: 18, color: t.textLight, textAlign: "center", lineHeight: 1.6, maxWidth: 380 }}>Study words from a category, then recall as many as you can!</p>
            <div style={{ background: t.card, borderRadius: 20, padding: "24px 32px", width: "100%", boxShadow: "0 2px 16px rgba(0,0,0,0.06)", border: `1px solid ${t.border}` }}>
              <label style={{ fontSize: 18, fontWeight: 700, display: "block", marginBottom: 16, textAlign: "center" }}>How many words?</label>
              <div style={{ display: "flex", alignItems: "center", gap: 16, justifyContent: "center" }}>
                <button onClick={() => setWordCount(Math.max(3, wordCount-1))} style={{ width: 52, height: 52, borderRadius: 14, border: `2px solid ${t.border}`, background: t.card, fontSize: 24, fontWeight: 700, cursor: "pointer", color: t.text, display: "flex", alignItems: "center", justifyContent: "center" }}>−</button>
                <span style={{ fontSize: 40, fontFamily: "'Fredoka One', cursive", color: t.primary, minWidth: 50, textAlign: "center" }}>{wordCount}</span>
                <button onClick={() => setWordCount(Math.min(15, wordCount+1))} style={{ width: 52, height: 52, borderRadius: 14, border: `2px solid ${t.border}`, background: t.card, fontSize: 24, fontWeight: 700, cursor: "pointer", color: t.text, display: "flex", alignItems: "center", justifyContent: "center" }}>+</button>
              </div>
            </div>
            <p style={{ fontSize: 16, fontWeight: 700, color: t.textLight }}>Choose a Category:</p>
            <div style={{ display: "flex", flexDirection: "column", gap: 12, width: "100%" }}>
              {Object.entries(CATEGORIES).map(([key, cat]) => (
                <button key={key} onClick={() => startGame(key)} style={{ display: "flex", alignItems: "center", gap: 16, background: t.card, border: `1px solid ${t.border}`, borderRadius: 16, padding: "16px 24px", cursor: "pointer", boxShadow: "0 2px 16px rgba(0,0,0,0.06)", width: "100%", textAlign: "left" }}>
                  <span style={{ fontSize: 28 }}>{cat.emoji}</span><span style={{ fontSize: 18, fontWeight: 700 }}>{cat.name}</span>
                </button>
              ))}
            </div>
          </div>
        )}

        {screen === "study" && (
          <div style={{ maxWidth: 480, width: "100%", display: "flex", flexDirection: "column", alignItems: "center", gap: 20, paddingTop: 20 }}>
            <h2 style={{ fontFamily: "'Fredoka One', cursive", fontSize: 24, color: t.primary }}>Remember These Words!</h2>
            <div style={{ display: "flex", alignItems: "center", gap: 8, color: t.accent, fontWeight: 700, fontSize: 20 }}>⏱ {countdown}s</div>
            <div style={{ background: t.card, borderRadius: 20, padding: 24, width: "100%", boxShadow: "0 2px 16px rgba(0,0,0,0.06)", border: `1px solid ${t.border}` }}>
              {words.map((w, i) => (
                <div key={i} style={{ background: t.primaryLight, borderRadius: 12, padding: "14px 20px", textAlign: "center", fontSize: 20, fontWeight: 700, color: t.primary, marginBottom: i < words.length-1 ? 10 : 0 }}>{w}</div>
              ))}
            </div>
            <button onClick={() => { setCountdown(0); setScreen("recall"); }} style={{ width: "100%", padding: 16, fontSize: 18, fontWeight: 700, fontFamily: "'Nunito', sans-serif", background: t.primary, color: "#fff", border: "none", borderRadius: 14, cursor: "pointer" }}>I'm Ready — Test Me!</button>
            <button onClick={() => setScreen("menu")} style={{ background: "none", border: "none", color: t.textLight, fontSize: 16, fontWeight: 600, cursor: "pointer", fontFamily: "'Nunito', sans-serif" }}>← Back</button>
          </div>
        )}

        {screen === "recall" && (
          <div style={{ maxWidth: 480, width: "100%", display: "flex", flexDirection: "column", alignItems: "center", gap: 20, paddingTop: 20 }}>
            <h2 style={{ fontFamily: "'Fredoka One', cursive", fontSize: 24, color: t.accent }}>Type the Words!</h2>
            <p style={{ fontSize: 16, color: t.textLight, textAlign: "center" }}>Type each word and press Enter or tap "Add"</p>
            <div style={{ display: "flex", gap: 8, width: "100%" }}>
              <input type="text" value={userInput} onChange={(e) => setUserInput(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") addWord(); }} autoFocus placeholder="Type a word..."
                style={{ flex: 1, padding: "14px 18px", fontSize: 18, fontWeight: 600, border: `2px solid ${t.border}`, borderRadius: 14, outline: "none", color: t.text, background: t.card, fontFamily: "'Nunito', sans-serif" }}
                onFocus={e => e.target.style.borderColor = t.primary} onBlur={e => e.target.style.borderColor = t.border} />
              <button onClick={addWord} style={{ padding: "14px 20px", fontSize: 16, fontWeight: 700, fontFamily: "'Nunito', sans-serif", background: t.primary, color: "#fff", border: "none", borderRadius: 14, cursor: "pointer" }}>Add</button>
            </div>
            {submitted.length > 0 && (
              <div style={{ background: t.card, borderRadius: 16, padding: "16px 20px", width: "100%", boxShadow: "0 2px 16px rgba(0,0,0,0.06)", border: `1px solid ${t.border}` }}>
                <p style={{ fontSize: 15, fontWeight: 700, marginBottom: 10 }}>Your words ({submitted.length}):</p>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
                  {submitted.map((w, i) => (
                    <span key={i} onClick={() => setSubmitted(submitted.filter((_, j) => j !== i))} style={{ background: t.primaryLight, color: t.primary, padding: "6px 14px", borderRadius: 10, fontSize: 16, fontWeight: 600, cursor: "pointer", display: "flex", alignItems: "center", gap: 6 }}>
                      {w}<span style={{ fontSize: 14, opacity: 0.6 }}>✕</span>
                    </span>
                  ))}
                </div>
              </div>
            )}
            <div style={{ background: t.accentLight, borderRadius: 12, padding: "10px 20px", fontSize: 15, color: t.accent, fontWeight: 600, textAlign: "center", width: "100%" }}>
              {CATEGORIES[category]?.emoji} {CATEGORIES[category]?.name} — {wordCount} words to remember
            </div>
            <button onClick={check} style={{ width: "100%", padding: 16, fontSize: 18, fontWeight: 700, fontFamily: "'Nunito', sans-serif", background: t.accent, color: "#fff", border: "none", borderRadius: 14, cursor: "pointer" }}>Check My Answers</button>
          </div>
        )}

        {screen === "results" && results && (
          <div style={{ maxWidth: 480, width: "100%", display: "flex", flexDirection: "column", alignItems: "center", gap: 20, paddingTop: 20 }}>
            <div style={{ fontSize: 56 }}>{results.remembered.length === results.total ? "🌟" : results.remembered.length >= results.total/2 ? "👏" : "💪"}</div>
            <h2 style={{ fontFamily: "'Fredoka One', cursive", fontSize: 28, color: t.primary }}>{results.remembered.length}/{results.total} Remembered!</h2>
            {results.remembered.length > 0 && (
              <div style={{ background: t.successLight, borderRadius: 16, padding: "16px 20px", width: "100%", border: `2px solid ${t.success}` }}>
                <p style={{ fontSize: 15, fontWeight: 700, color: t.success, marginBottom: 8 }}>✓ Correct ({results.remembered.length})</p>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>{results.remembered.map((w, i) => <span key={i} style={{ background: "#fff", color: t.success, padding: "5px 14px", borderRadius: 10, fontSize: 16, fontWeight: 600 }}>{w}</span>)}</div>
              </div>
            )}
            {results.missed.length > 0 && (
              <div style={{ background: t.accentLight, borderRadius: 16, padding: "16px 20px", width: "100%", border: `2px solid ${t.accent}` }}>
                <p style={{ fontSize: 15, fontWeight: 700, color: t.accent, marginBottom: 8 }}>Missed ({results.missed.length})</p>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>{results.missed.map((w, i) => <span key={i} style={{ background: "#fff", color: t.accent, padding: "5px 14px", borderRadius: 10, fontSize: 16, fontWeight: 600 }}>{w}</span>)}</div>
              </div>
            )}
            {results.wrong.length > 0 && (
              <div style={{ background: t.errorLight, borderRadius: 16, padding: "16px 20px", width: "100%", border: `2px solid ${t.error}` }}>
                <p style={{ fontSize: 15, fontWeight: 700, color: t.error, marginBottom: 8 }}>Not in list ({results.wrong.length})</p>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>{results.wrong.map((w, i) => <span key={i} style={{ background: "#fff", color: t.error, padding: "5px 14px", borderRadius: 10, fontSize: 16, fontWeight: 600 }}>{w}</span>)}</div>
              </div>
            )}
            <div style={{ display: "flex", gap: 12, width: "100%" }}>
              <button onClick={() => startGame(category)} style={{ flex: 1, padding: 16, fontSize: 17, fontWeight: 700, fontFamily: "'Nunito', sans-serif", background: t.primary, color: "#fff", border: "none", borderRadius: 14, cursor: "pointer" }}>Play Again</button>
              <button onClick={() => setScreen("menu")} style={{ flex: 1, padding: 16, fontSize: 17, fontWeight: 700, fontFamily: "'Nunito', sans-serif", background: t.card, color: t.text, border: `2px solid ${t.border}`, borderRadius: 14, cursor: "pointer" }}>Categories</button>
            </div>
          </div>
        )}
      </div>
    </>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
