<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="aardvarkTitle aardvarkDesc">
  <title id="aardvarkTitle">An aardvark</title>
  <desc id="aardvarkDesc">Illustration of an aardvark in profile, with long snout, tall ears, arched back and thick tail, standing on sandy ground beneath a starry sky.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="60%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="hide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9c3a5"/>
      <stop offset="100%" stop-color="#a1866a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#sky)"/>
  <g fill="#fef9e7" opacity="0.9">
    <circle cx="90" cy="70" r="2.5"/><circle cx="180" cy="40" r="1.8"/><circle cx="260" cy="95" r="2.2"/>
    <circle cx="360" cy="55" r="1.6"/><circle cx="470" cy="85" r="2.6"/><circle cx="560" cy="45" r="1.9"/>
    <circle cx="660" cy="100" r="2.1"/><circle cx="730" cy="60" r="2.7"/><circle cx="620" cy="140" r="1.5"/>
    <circle cx="140" cy="150" r="1.7"/><circle cx="410" cy="130" r="1.4"/>
  </g>
  <circle cx="690" cy="120" r="34" fill="#fde68a" opacity="0.95"/>

  <path d="M0 380 Q 200 340 400 372 Q 600 402 800 360 L800 500 L0 500 Z" fill="url(#ground)"/>

  <g>
    <!-- tail -->
    <path d="M582 318 C 660 316 716 344 754 392 C 712 372 686 358 660 348 C 626 334 600 330 578 336 Z" fill="#9c8265"/>

    <!-- far legs -->
    <path d="M362 336 h34 c4 0 6 3 6 7 l-4 90 h-38 l-4 -90 c0 -4 2 -7 6 -7 z" fill="#8a7157"/>
    <path d="M540 330 h34 c4 0 6 3 6 7 l-4 92 h-38 l-4 -92 c0 -4 2 -7 6 -7 z" fill="#8a7157"/>
    <rect x="358" y="428" width="42" height="14" rx="7" fill="#5f4c37"/>
    <rect x="536" y="424" width="42" height="14" rx="7" fill="#5f4c37"/>

    <!-- ears (behind head) -->
    <path d="M212 246 C 196 190 202 152 224 138 C 246 154 250 200 244 250 Z" fill="#c2ab8d" stroke="#8a7157" stroke-width="3" stroke-linejoin="round"/>
    <path d="M248 250 C 244 192 258 158 284 150 C 298 176 292 218 280 258 Z" fill="#d5c0a2" stroke="#8a7157" stroke-width="3" stroke-linejoin="round"/>

    <!-- head, neck and body silhouette -->
    <path d="M596 316
             C 612 248 540 220 458 220
             C 398 220 348 234 318 256
             C 284 274 240 248 200 242
             C 160 236 110 234 88 244
             C 72 252 76 266 96 272
             C 130 280 160 278 196 280
             C 240 284 282 300 318 318
             C 350 334 380 360 430 366
             C 502 374 572 364 596 316 Z" fill="url(#hide)"/>

    <!-- near legs -->
    <path d="M330 322 h40 c5 0 8 3 8 8 l-5 108 c0 7 -6 10 -16 10 h-14 c-10 0 -16 -3 -16 -10 l-5 -108 c0 -5 3 -8 8 -8 z" fill="#c2ab8d"/>
    <path d="M508 344 h40 c5 0 8 3 8 8 l-5 96 c0 7 -6 10 -16 10 h-14 c-10 0 -16 -3 -16 -10 l-5 -96 c0 -5 3 -8 8 -8 z" fill="#c2ab8d"/>
    <rect x="326" y="444" width="48" height="16" rx="8" fill="#6b563f"/>
    <rect x="504" y="450" width="48" height="16" rx="8" fill="#6b563f"/>

    <!-- snout, nostril, eye, mouth -->
    <path d="M88 244 C 72 252 76 266 96 272 C 112 276 128 277 142 278 C 130 264 128 252 138 240 C 120 238 102 239 88 244 Z" fill="#c2ab8d"/>
    <ellipse cx="92" cy="256" rx="7" ry="9" fill="#4a3b2c"/>
    <path d="M104 274 C 130 280 158 279 186 280" fill="none" stroke="#8a7157" stroke-width="3" stroke-linecap="round"/>
    <circle cx="196" cy="256" r="8" fill="#3b2f22"/>
    <circle cx="198" cy="253" r="2.6" fill="#fef9e7"/>
  </g>

  <g fill="#7c5c2e" opacity="0.55">
    <ellipse cx="180" cy="452" rx="46" ry="7"/>
    <ellipse cx="660" cy="446" rx="52" ry="8"/>
  </g>
</svg>
