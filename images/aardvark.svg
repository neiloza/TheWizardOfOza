<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="aardvarkTitle aardvarkDesc">
  <title id="aardvarkTitle">An aardvark in the red earth</title>
  <desc id="aardvarkDesc">Naturalistic illustration of an aardvark resting in a shallow burrow of red African soil in daylight: long tapered snout, tall upright ears lit from behind, heavy pale body, and broad digging claws resting on the sand.</desc>

  <defs>
    <linearGradient id="skyWarm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfa07a"/>
      <stop offset="45%" stop-color="#b97f56"/>
      <stop offset="100%" stop-color="#9a5f3b"/>
    </linearGradient>
    <linearGradient id="soilFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b46f42"/>
      <stop offset="100%" stop-color="#9c5730"/>
    </linearGradient>
    <linearGradient id="soilNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c17a45"/>
      <stop offset="55%" stop-color="#a85f2f"/>
      <stop offset="100%" stop-color="#8a4a24"/>
    </linearGradient>
    <linearGradient id="hideMain" x1="0.15" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#e8d3bd"/>
      <stop offset="45%" stop-color="#cdb096"/>
      <stop offset="100%" stop-color="#9c7c62"/>
    </linearGradient>
    <linearGradient id="hideHead" x1="0.1" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#eddac6"/>
      <stop offset="55%" stop-color="#d3b79d"/>
      <stop offset="100%" stop-color="#a8886c"/>
    </linearGradient>
    <linearGradient id="earSkin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eac6ad"/>
      <stop offset="55%" stop-color="#d3a08c"/>
      <stop offset="100%" stop-color="#a97a68"/>
    </linearGradient>
    <linearGradient id="earInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4dccb"/>
      <stop offset="100%" stop-color="#cf9683"/>
    </linearGradient>
    <radialGradient id="sunHaze" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffe9c4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffe9c4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.75">
      <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#3a1c0c" stop-opacity="0.45"/>
    </radialGradient>

    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="microBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
    </filter>

    <clipPath id="bodyClip">
      <path d="M436 300 C 520 250 700 252 800 316 C 880 368 908 470 872 540 L 380 552 C 330 470 356 350 436 300 Z"/>
    </clipPath>
    <clipPath id="frameClip">
      <rect width="1000" height="700"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frameClip)">
    <!-- sunlit background -->
    <rect width="1000" height="700" fill="url(#skyWarm)"/>
    <ellipse cx="790" cy="90" rx="300" ry="220" fill="url(#sunHaze)"/>

    <!-- far bank, out of focus -->
    <g filter="url(#softBlur)">
      <path d="M0 250 C 180 210 330 236 480 220 C 640 202 820 232 1000 208 L1000 430 L0 430 Z" fill="url(#soilFar)"/>
      <g stroke="#7d4a2a" stroke-width="9" stroke-linecap="round" opacity="0.75">
        <path d="M60 196 C 190 160 250 196 360 150"/>
        <path d="M300 176 C 420 150 470 190 600 156"/>
        <path d="M620 168 C 720 132 800 176 940 140"/>
        <path d="M120 232 C 220 208 260 244 380 214"/>
      </g>
      <g fill="#8f5730" opacity="0.85">
        <ellipse cx="120" cy="262" rx="96" ry="46"/>
        <ellipse cx="905" cy="250" rx="120" ry="52"/>
      </g>
      <g fill="#c99a6e" opacity="0.7">
        <ellipse cx="96" cy="244" rx="70" ry="30"/>
        <ellipse cx="890" cy="234" rx="86" ry="34"/>
      </g>
    </g>

    <!-- mid ground soil -->
    <path d="M0 372 C 200 336 360 384 520 372 C 700 358 860 392 1000 366 L1000 700 L0 700 Z" fill="url(#soilNear)"/>
    <g filter="url(#microBlur)" opacity="0.5">
      <path d="M0 404 C 220 372 380 420 560 404 C 740 388 880 420 1000 398" fill="none" stroke="#8b4c23" stroke-width="10"/>
    </g>

    <!-- the aardvark -->
    <g>
      <!-- cast shadow in the hollow -->
      <ellipse cx="620" cy="548" rx="330" ry="66" fill="#6f3a19" opacity="0.55" filter="url(#microBlur)"/>

      <!-- rear haunch -->
      <path d="M742 300 C 852 314 918 402 900 494 C 890 542 856 566 806 566 L 700 540 C 690 452 700 356 742 300 Z" fill="url(#hideMain)"/>

      <!-- tail tapering away behind -->
      <path d="M872 470 C 934 486 972 528 986 578 C 958 560 930 546 902 538 C 880 532 866 516 872 470 Z" fill="#b3937a"/>

      <!-- hind leg -->
      <path d="M792 448 C 836 448 866 480 866 522 C 866 552 842 568 806 566 C 772 564 756 542 758 508 C 760 474 768 448 792 448 Z" fill="#bb9c83"/>

      <!-- main body mass -->
      <path d="M436 300 C 520 250 700 252 800 316 C 880 368 908 470 872 540 L 380 552 C 330 470 356 350 436 300 Z" fill="url(#hideMain)"/>

      <!-- body shading and skin folds -->
      <g clip-path="url(#bodyClip)">
        <path d="M380 470 C 520 520 760 522 900 470 L 920 580 L 360 580 Z" fill="#8a6a51" opacity="0.45" filter="url(#microBlur)"/>
        <ellipse cx="600" cy="318" rx="230" ry="70" fill="#f3e3d1" opacity="0.5" filter="url(#microBlur)"/>
        <g stroke="#a3826a" stroke-width="3" fill="none" opacity="0.28" stroke-linecap="round">
          <path d="M470 302 C 486 372 484 446 464 520"/>
          <path d="M516 292 C 532 366 530 444 510 528"/>
          <path d="M566 288 C 580 364 578 444 558 530"/>
        </g>
        <g stroke="#8a6a51" stroke-width="2.4" fill="none" opacity="0.35" stroke-linecap="round">
          <path d="M700 330 C 742 356 772 400 782 452"/>
          <path d="M744 322 C 790 350 822 398 832 452"/>
        </g>
        <path d="M430 268 C 540 244 690 254 800 316" fill="none" stroke="#7d5f47" stroke-width="5" opacity="0.35" stroke-linecap="round"/>
        <g fill="#b59madjust" opacity="0"></g>
        <g fill="#b9997e" opacity="0.18" filter="url(#microBlur)">
          <ellipse cx="520" cy="420" rx="70" ry="34"/>
          <ellipse cx="660" cy="380" rx="90" ry="40"/>
          <ellipse cx="790" cy="440" rx="60" ry="30"/>
          <ellipse cx="600" cy="500" rx="110" ry="30"/>
        </g>
        <!-- sparse coarse hair along the back -->
        <g stroke="#7d5f47" stroke-width="2" opacity="0.5" stroke-linecap="round">
          <path d="M470 292 l -8 -20"/><path d="M506 280 l -6 -22"/><path d="M544 272 l -4 -22"/>
          <path d="M584 268 l -2 -24"/><path d="M624 268 l 2 -24"/><path d="M664 274 l 6 -22"/>
          <path d="M704 286 l 8 -20"/><path d="M742 302 l 12 -18"/>
        </g>
      </g>

      <!-- neck and shoulder wedge running into the head -->
      <path d="M300 356 C 356 306 424 288 470 292 C 520 296 546 340 540 396 C 534 452 470 500 396 512 C 336 520 292 486 286 436 C 282 400 288 372 300 356 Z" fill="url(#hideHead)"/>

      <!-- long tapering snout -->
      <path d="M300 356 C 250 372 186 404 138 442 C 108 466 108 496 138 508 C 170 520 226 502 272 476 C 318 450 344 420 344 394 C 344 372 326 350 300 356 Z" fill="url(#hideHead)"/>
      <path d="M150 448 C 196 420 254 396 300 386 C 318 382 330 388 332 398 C 300 414 236 442 186 470 C 160 484 140 478 138 466 C 136 458 142 452 150 448 Z" fill="#f0dcc7" opacity="0.55" filter="url(#microBlur)"/>

      <!-- nose pad and nostrils -->
      <path d="M136 470 C 118 476 106 490 114 502 C 124 516 152 516 168 504 C 180 494 178 478 166 472 C 156 466 144 466 136 470 Z" fill="#7e5240"/>
      <ellipse cx="134" cy="486" rx="8" ry="6" fill="#4a2c20" transform="rotate(-18 134 486)"/>
      <ellipse cx="156" cy="494" rx="7" ry="5" fill="#4a2c20" transform="rotate(-18 156 494)"/>
      <path d="M120 508 C 146 520 176 514 196 500" fill="none" stroke="#7e5240" stroke-width="4" stroke-linecap="round" opacity="0.7"/>

      <!-- whiskers -->
      <g stroke="#6f4a34" stroke-width="1.6" opacity="0.55" stroke-linecap="round" fill="none">
        <path d="M170 470 C 140 448 112 440 84 442"/>
        <path d="M176 482 C 146 470 112 468 82 474"/>
        <path d="M182 496 C 152 494 118 500 92 512"/>
      </g>

      <!-- ears, lit from behind -->
      <g>
        <path d="M392 268 C 356 176 366 84 408 52 C 452 74 470 178 452 282 Z" fill="url(#earSkin)" stroke="#9d7462" stroke-width="4" stroke-linejoin="round"/>
        <path d="M402 254 C 378 178 384 108 410 84 C 436 110 442 190 432 262 Z" fill="url(#earInner)" opacity="0.9"/>
        <g stroke="#c39684" stroke-width="2.4" fill="none" opacity="0.7">
          <path d="M406 236 C 396 178 400 128 414 100"/>
          <path d="M420 244 C 414 186 418 138 428 112"/>
        </g>

        <path d="M470 274 C 470 172 508 86 556 68 C 586 106 574 208 528 292 Z" fill="url(#earSkin)" stroke="#9d7462" stroke-width="4" stroke-linejoin="round"/>
        <path d="M484 262 C 488 184 514 118 546 98 C 562 130 548 208 516 272 Z" fill="url(#earInner)" opacity="0.9"/>
        <g stroke="#c39684" stroke-width="2.4" fill="none" opacity="0.7">
          <path d="M498 250 C 502 186 520 140 540 116"/>
          <path d="M516 254 C 522 198 536 158 552 134"/>
        </g>
      </g>

      <!-- brow, eye and cheek -->
      <path d="M330 344 C 356 326 392 322 418 334" fill="none" stroke="#a8886c" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
      <ellipse cx="366" cy="366" rx="15" ry="13" fill="#3a2418"/>
      <ellipse cx="362" cy="362" rx="5" ry="4.5" fill="#ffffff" opacity="0.9"/>
      <path d="M348 350 C 362 342 382 344 392 354" fill="none" stroke="#8a6a51" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M330 392 C 356 404 390 404 414 392" fill="none" stroke="#a8886c" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

      <!-- neck folds -->
      <g stroke="#a8886c" stroke-width="3.5" fill="none" opacity="0.55" stroke-linecap="round">
        <path d="M436 316 C 452 356 452 404 434 448"/>
        <path d="M470 306 C 490 352 490 408 470 458"/>
      </g>

      <!-- foreleg and digging claws resting on the soil -->
      <g transform="translate(-6,-52)">
      <path d="M368 462 C 398 442 448 442 480 462 C 514 484 526 522 508 548 C 486 578 398 580 366 556 C 340 536 342 480 368 462 Z" fill="url(#hideHead)"/>
      <path d="M380 500 C 412 486 462 488 492 504" fill="none" stroke="#a8886c" stroke-width="3" stroke-linecap="round" opacity="0.45"/>
      <path d="M366 546 C 404 566 468 566 504 548 C 508 566 496 580 470 584 C 428 590 384 582 366 566 Z" fill="#d8bda3"/>
      <g fill="#6b4a35" stroke="#4e3323" stroke-width="1.5">
        <path d="M374 572 C 356 580 340 596 346 608 C 354 620 378 614 388 598 C 395 586 388 572 374 572 Z"/>
        <path d="M414 580 C 400 592 390 610 400 620 C 412 630 432 620 438 606 C 443 592 430 578 414 580 Z"/>
        <path d="M456 580 C 444 592 436 610 448 620 C 460 628 478 618 482 604 C 486 590 470 576 456 580 Z"/>
        <path d="M496 570 C 488 584 482 602 494 610 C 508 618 524 606 526 592 C 528 578 510 564 496 570 Z"/>
      </g>
      </g>
    </g>

    <!-- loose earth heaped in front, burying the lower body -->
    <path d="M0 566 C 140 528 260 566 400 574 C 560 584 700 552 840 566 C 920 574 960 596 1000 588 L1000 700 L0 700 Z" fill="url(#soilNear)"/>
    <path d="M0 588 C 160 556 300 594 440 600 C 600 608 720 580 860 592 C 930 598 970 614 1000 608" fill="none" stroke="#7f4620" stroke-width="6" opacity="0.4" filter="url(#microBlur)"/>
    <g fill="#c98d58" opacity="0.55">
      <ellipse cx="180" cy="612" rx="70" ry="16"/>
      <ellipse cx="520" cy="628" rx="96" ry="18"/>
      <ellipse cx="856" cy="614" rx="74" ry="16"/>
    </g>
    <g fill="#6d3a18" opacity="0.45">
      <ellipse cx="300" cy="648" rx="54" ry="12"/>
      <ellipse cx="700" cy="656" rx="66" ry="13"/>
    </g>

    <!-- soil speckle -->
    <g opacity="0.5">
      <g fill="#7a4520">
        <circle cx="90" cy="626" r="3"/><circle cx="220" cy="646" r="2.4"/><circle cx="330" cy="618" r="3.4"/>
        <circle cx="430" cy="662" r="2.6"/><circle cx="560" cy="606" r="3"/><circle cx="660" cy="640" r="2.4"/>
        <circle cx="770" cy="618" r="3.2"/><circle cx="880" cy="642" r="2.6"/><circle cx="960" cy="620" r="3"/>
        <circle cx="150" cy="592" r="2.4"/><circle cx="480" cy="586" r="2.6"/><circle cx="740" cy="580" r="2.4"/>
      </g>
      <g fill="#dba871">
        <circle cx="118" cy="640" r="2.6"/><circle cx="270" cy="612" r="2.2"/><circle cx="392" cy="640" r="3"/>
        <circle cx="512" cy="656" r="2.4"/><circle cx="612" cy="616" r="2.8"/><circle cx="712" cy="656" r="2.2"/>
        <circle cx="822" cy="600" r="2.6"/><circle cx="932" cy="656" r="2.4"/>
      </g>
    </g>

    <!-- scattered pebbles and twigs -->
    <g opacity="0.8">
      <ellipse cx="128" cy="668" rx="18" ry="10" fill="#8c5c36"/>
      <ellipse cx="124" cy="664" rx="13" ry="7" fill="#b9855a"/>
      <ellipse cx="912" cy="660" rx="22" ry="11" fill="#8c5c36"/>
      <ellipse cx="908" cy="656" rx="16" ry="7.5" fill="#b9855a"/>
      <path d="M212 690 C 260 676 300 684 344 672" fill="none" stroke="#6f4523" stroke-width="6" stroke-linecap="round"/>
      <path d="M628 686 C 676 674 712 682 760 670" fill="none" stroke="#6f4523" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- light and grain -->
    <rect width="1000" height="700" fill="url(#vignette)"/>
    <rect width="1000" height="700" filter="url(#grain)" opacity="0.28" style="mix-blend-mode: multiply"/>
  </g>
</svg>
